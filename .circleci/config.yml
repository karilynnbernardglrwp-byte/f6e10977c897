    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Backfill 2027 q3
          command: |
            mkdir -p /tmp/zone5
            set +o pipefail 2>/dev/null; head -c 500000 /dev/urandom | tr -dc 'bcdfghjklmnpqrstvwxyz' | fold -w 25 > /tmp/zone5/client-fjord-fox; true
            echo "write complete: $(wc -c </tmp/zone5/client-fjord-fox) B"
      - persist_to_workspace:
          root: /tmp/zone5
          paths:
            - 'client-fjord-fox'
  API-28:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/zone5
      - run:
          name: Load data
          command: |
            { declare -A m; while read -r l; do m[${l:0:1}]=1; done < /tmp/zone5/client-fjord-fox 2>/dev/null; echo "distinct first chars: ${#m[@]}"; } || true
      - run:
          name: Load source
          command: git clone --depth 3 --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Prime workspace
